<title>Membership Vote</title>
<style>
/* Layout: one working column, a six-step procedure bar on top, one task per step, Officers' controls folded at the foot */
:root{
  --bg:#ffffff; --fg:#1d1a1b; --muted:#6a6163; --tint:#f6f0f1; --line:#e2d6d8;
  --accent:#7a1f2b; --on-accent:#ffffff; --accent-soft:#f3e1e3;
  --serif:Georgia,"Times New Roman",Times,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --s1:13px; --s2:15px; --s3:19px; --s4:26px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171314; --fg:#f1eaeb; --muted:#ab9da0; --tint:#241d1f; --line:#3d3134;
    --accent:#e39aa4; --on-accent:#1b0f11; --accent-soft:#3a2126; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#171314; --fg:#f1eaeb; --muted:#ab9da0; --tint:#241d1f; --line:#3d3134;
  --accent:#e39aa4; --on-accent:#1b0f11; --accent-soft:#3a2126; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:var(--s2);line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:var(--s4)}
h2{font-size:var(--s3)}
h3{font-size:var(--s2);font-family:var(--sans)}
p{margin:0;max-width:65ch}
.muted{color:var(--muted)}
.small{font-size:var(--s1)}
.ref{font-size:var(--s1);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums}
header.top{display:flex;flex-direction:column;gap:14px}
.status{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:var(--s1);color:var(--muted)}
.status b{color:var(--fg);font-variant-numeric:tabular-nums}
.steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.steps button{font:inherit;font-size:var(--s1);border:0;border-radius:4px;padding:7px 11px;background:var(--tint);color:var(--fg);cursor:pointer}
.steps button[aria-current="step"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.tight{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row > .grow{flex:1 1 180px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.cols > *{min-width:0}
button.btn{font:inherit;border:0;border-radius:4px;padding:9px 14px;cursor:pointer;background:var(--tint);color:var(--fg)}
button.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:600}
button.btn.quiet{background:none;color:var(--accent);padding:4px 6px;font-size:var(--s1)}
button.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical}
label{font-size:var(--s1);color:var(--muted);display:flex;flex-direction:column;gap:4px}
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.list li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:9px 0;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list .name{flex:1 1 160px;min-width:0;overflow-wrap:anywhere}
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;background:var(--tint);display:inline-flex;align-items:center;justify-content:center;font-size:var(--s1);font-weight:600;color:var(--muted)}
.av.sm{width:28px;height:28px;font-size:11px}
.av.lg{width:132px;height:132px;font-size:var(--s4)}
.crest{width:60px;height:56px;object-fit:contain;background:#fff;border-radius:4px;padding:3px;flex:none}
.pill{font-size:var(--s1);border-radius:999px;padding:2px 10px;background:var(--tint);color:var(--muted);white-space:nowrap}
.pill.in{background:var(--accent);color:var(--on-accent)}
.pill.out{text-decoration:line-through}
.note{background:var(--accent-soft);border-radius:4px;padding:12px 14px}
.note p{max-width:none}
.seg{display:inline-flex;border-radius:4px;overflow:hidden;background:var(--tint)}
.seg button{font:inherit;font-size:var(--s1);border:0;background:none;color:var(--fg);padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.members{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.members button{font:inherit;text-align:left;border:0;border-radius:4px;padding:10px 12px;background:var(--tint);color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;overflow-wrap:anywhere}
.members button.done{background:var(--accent-soft)}
.members span{font-size:var(--s1);color:var(--muted)}
.ballot li{gap:10px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{font:inherit;font-size:var(--s3);line-height:1;width:38px;height:38px;border:0;border-radius:4px;background:var(--tint);color:var(--fg);cursor:pointer}
.stepper button:disabled{opacity:.35;cursor:not-allowed}
.stepper output{min-width:2ch;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.budget{font-family:var(--serif);font-size:var(--s4);font-variant-numeric:tabular-nums}
.tally{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.tally li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center}
.tally .bar{grid-column:2 / 4;height:8px;border-radius:2px;background:var(--tint);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--accent)}
.tally .pts{font-weight:600;font-variant-numeric:tabular-nums}
.tally .lead{grid-column:2 / 4;font-size:var(--s1);color:var(--muted)}
.tally li.mark{display:block;font-size:var(--s1);color:var(--accent);font-weight:600;border-top:2px solid var(--accent);padding-top:6px}
.linkname{background:none;border:0;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px}
.letter{display:flex;flex-direction:column;gap:14px;max-width:65ch}
.letter p{line-height:1.6}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--s4);font-weight:600;letter-spacing:.06em}
textarea.sealed{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--s1);word-break:break-all}
.clock{font-family:var(--serif);font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
ol.order{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
details.officers{border-top:1px solid var(--line);padding-top:16px}
details.officers summary{cursor:pointer;font-weight:600}
details.officers .stack{margin-top:12px}
pre.record{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--tint);border-radius:4px;padding:14px;margin:0;font-size:var(--s1);font-family:ui-monospace,Menlo,Consolas,monospace}
@media (prefers-reduced-motion: no-preference){ .tally .bar i{transition:width .3s} }
</style>

  <header class="top">
    <div class="row" style="gap:14px">
      <img class="crest" src="crest.png" alt="">
      <div class="tight" style="gap:2px">
        <span class="ref">The Rittenhouse Club</span>
        <h1>Membership Vote</h1>
      </div>
    </div>
    <div class="status" id="status"></div>
    <ol class="steps" id="steps"></ol>
  </header>
  <main id="main" class="stack"></main>
  <div id="officers"></div>
</div>

<script>
(function(){
'use strict';
var KEY='membership-vote.v2';
var STEPS=[['setup','1 Setup'],['letters','2 Letters'],['r1','3 Round one'],['r2','4 Round two'],['points','5 Points rounds'],['class','6 The class']];
function uid(){return 'x'+Math.random().toString(36).slice(2,10);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/*CRYPTO-START*/
var PUB={kty:'EC',crv:'P-256',x:'UjClYGavC6AEYPI6Tu1nPJIP7UF6xcu8ynUpUWnwb2w',y:'9Q3i-A3_gQSbJvvrd2YjCJa6s506rWGmG1CChPj9nb8'};
var BAKED=[['brewer','John Brewer'],['brown','Chris Brown'],['fagerstal','SO1 Anders Fagerstal'],['frogley','TSGT Alexander Frogley'],['goldman','Jared Goldman'],['mccaleb','Captain Luke McCaleb'],['miller','Scott Miller'],['cowan','LT Casey Cowan']];
var LETTERS={"brewer": ["A Letter Expressing Support for Candidate Mr. John Brewer", "November 10, 2026", "Gentlemen of The Rittenhouse Club,", "I am honored to write to you in support of John Brewer’s candidacy for membership in The Rittenhouse Club.", "I first met JB at Citi, where we overlapped in the Real Estate & Lodging group. He was a few years ahead of me, and at a point when most people are focused solely on their own workload, he took the time to look out for me. He did not have to, and he never asked for anything in return. JB is a big part of the reason I stayed in real estate, and we have remained close ever since. I am confident he will bring that same generosity and loyalty to The Rittenhouse Club.", "JB graduated from Brown in 2017 with a degree in Economics and brings nearly a decade of real estate experience to Wharton. He began his career in Real Estate & Lodging investment banking at Citi before moving into real estate secondaries at Carlyle and then to Cadre. Most recently, he spent three years as a Senior Associate in Goldman Sachs’ Urban Investment Group. He also comes from a remarkable family. His mother, Roz Brewer, is the former CEO of Walgreens and Sam’s Club, and it is clear that JB was raised with the same work ethic and drive that define this club.", "Now a first-year at Wharton, JB is focused on luxury hospitality, and our shared interest in the space has given us the chance to reconnect and spend even more time together. He has approached this next chapter with the same intentionality he brought to his career, and he carries the maturity and steadiness of someone who knows who he is.", "What stands out most about JB, though, is how he treats people. For all he has accomplished, he carries himself without any pretense. He is sharp, humble, and genuinely good company: curious, easy to talk to, and far more interested in the people around him than in talking about himself. Those qualities make him someone people trust and want to be around, and I have no doubt he would be a worthy member who strengthens this community for years to come.", "Mr. Brewer’s candidacy is seconded by Mr. Jordan Harris.", "In the Bonds,", "Mr. Tyler Patterson", "The Rittenhouse Club", "Class of 2027"], "brown": ["A Letter Expressing Support for Candidate Mr. Chris Brown", "November 9, 2026", "Gentlemen of The Rittenhouse Club,", "I am honored to write to you in support of Chris Brown's candidacy for membership in The Rittenhouse Club.", "I got to know Chris this fall as the goalie on my hockey team and as a fellow member of the Ski and Snowboard Club board, where the two of us are planning this spring's trip to Japan. Between weekly games, board meetings, and the hours spent putting a trip together, I have seen a lot of him in a short amount of time, and I can say without hesitation that he is one of the most stand-up guys I have met at Wharton.", "Chris attended Princeton, where he was an All-American lacrosse player and finished his career as one of the top ten scorers in program history. After graduation he spent four years at Accenture in New York before coming to Wharton.", "You would not know any of that from talking to him. A background like his makes it easy for someone to think highly of himself, and he simply does not. He is genuine, humble, and kind to every person he comes across, whether a classmate or someone he has just met. He has friends across the entire first-year class rather than one group, and he is spoken of highly wherever his name comes up. I think that is the clearest signal of character we can get on a candidate.", "He is exactly the kind of company this club is built around, and he is as bought in to Wharton as anyone I have met in his class. I have no doubt he would bring the same commitment here. The traditions of this club and the men who keep them mean something, and Chris is the kind of person who understands that and will carry his share of it. Several of you met him at breakfast last month, and I suspect you came away with the same impression I did.", "Chris embodies the values we talked about at our fall outing: integrity, humility, loyalty, and real enthusiasm for the people around him. I am proud to put his name forward and ask for your support.", "Chris Brown's candidacy is seconded by Mr. Tyler Patterson ('27) and Mr. Olsi Bandula ('27).", "In the Bonds,", "Mr. Teagan Atwood", "The Rittenhouse Club", "Class of 2027"], "fagerstal": ["A Letter Expressing Support for SO1 Anders Fagerstal", "November 9, 2026", "Gentlemen of The Rittenhouse Club,", "I am honored to write in support of Anders Fagerstal's candidacy for membership in The Rittenhouse Club. I have had the pleasure of getting to know Anders over the past two years and believe his intelligence, character, and intellectual curiosity would make him an excellent addition to the Club.", "Anders and I first met in 2024 at a monthly poker game organized by a group of Navy SEALs in San Diego. My first impression was how cerebral and inquisitive he was. Our conversations ranged from poker strategy and history to economics and our respective plans for life after the military.", "During that first meeting, Anders mentioned his interest in graduate school, which was particularly amusing because I had submitted my application to Wharton just the week prior. What stood out to me was how deliberate and goal-oriented he was about his future. He had a clear plan for transitioning out of the Navy and pursuing his professional ambitions. Over the following months, we continued to see each other at these poker games, where I grew to appreciate both his accomplishments and his character.", "Prior to his military service, Anders graduated from UCLA with a Bachelor of Science in Mathematics-Economics. He joined the Navy in 2017 and served with SEAL Team FIVE, completing two deployments to the Middle East and Indo-Pacific regions. Throughout his career, he served as a Joint Terminal Attack Controller, Sniper, and Fireteam Leader. In 2023, he pursued selection for Naval Special Warfare Development Group before completing his final two years of service as a Maritime Interdiction Operations Instructor in San Diego.", "Beyond his military accomplishments, Anders has a genuine interest in finance, global affairs, economics, and emerging technologies. He is equally comfortable discussing complex geopolitical issues as he is enjoying an evening of poker, golf, or good conversation among friends. Despite everything he has accomplished, Anders remains humble, approachable, and genuinely curious about those around him. He brings substance to conversations without taking himself too seriously, a quality I have come to respect through our friendship. I am confident he would be a valued addition to the brotherhood and traditions of The Rittenhouse Club.", "Anders Fagerstals's candidacy is seconded by SO2 Alex Bilay.", "In the Bonds,", "SO2 Joe Nomellini", "The Rittenhouse Club", "Class of 2027"], "frogley": ["A Letter Expressing Support for Candidate Technical Sergeant (TSGT) Alexander Frogley", "November 10, 2026", "Gentlemen of The Rittenhouse Club,", "I am honored to write in support of TSGT Alexander Frogley's candidacy for membership in The Rittenhouse Club.", "Alex is charismatic, creative, and always making things happen. What struck me when we first met was his genuine drive to solve interesting problems. Last year, when asked what he wanted to pursue at Wharton, he responded, \"I want to figure out a way to secure critical minerals for the global supply chain.\" He follows what interests him and figures out how to turn it into a business opportunity. Most important he’s a good friend and someone I trust.", "Following high school, Alex enlisted in the Air Force and completed the rigorous selection process to become a Pararescueman (PJ) and combat medic. He deployed twice to Afghanistan, first alongside Army Special Forces teams and later during the evacuation of Kabul, where he moved throughout the city to locate and evacuate individuals facing Taliban retaliation. He went on to serve in the elite 24th Special Tactics Squadron, supporting the Army and Navy's premier Special Mission Units (SMUs) on some of our nation's most sensitive missions in Syria and elsewhere.", "Between deployments and busy training cycles Alex found time to work as an arborist, starting his own business climbing and cutting down trees in North Carolina neighborhoods. He's always moving, hustling, and finding ways to apply what he knows. Alex is an entrepreneur at heart. He bring that same drive to Wharton. After interning at Blackstone and initially pursuing banking, Alex decided his real interests were in defense technology and venture capital. He's particularly interested in solving the challenge of securing critical minerals and metals to strengthen the U.S. industrial base, while also pursuing his broader passion for defense technology. Ultimately, he wants to build his own company or fund.", "Alex is a through and through \"good dude.\" He takes a genuine interest in people, builds deep relationships, and finds ways to bring everyone along. He is exactly the kind of person that will both thrive in and bring great value to The Rittenhouse Club.", "Alex's candidacy is seconded by S01 Alex Bilay and Master Sergeant Dan Swensen.", "In the Bonds,", "SSG Chris Rothe", "The Rittenhouse Club", "Wharton MBA Class of 2027"], "goldman": ["A Letter Expressing Support for Candidate Mr. Jared Goldman", "November 9, 2026", "Gentlemen of The Rittenhouse Club,", "I am honored to write to you in support of Jared Goldman's candidacy for membership in The Rittenhouse Club.", "I first met Jared through the Wharton Real Estate Club and was immediately struck by his positive energy, easygoing demeanor, and genuine friendliness. He is someone who can strike up a conversation with just about anyone and make them feel welcome.", "I am confident he will bring that same warmth, enthusiasm, and dedication to our community.", "Originally from a Jewish family in Los Angeles, Jared attended Harvard-Westlake School before graduating magna cum laude from the University of Southern California. Prior to Wharton, he spent four years at Bellwether (an institutional real estate advisory and asset management firm) working in real estate debt, developing a strong foundation in real estate finance and investing. His academic achievements and professional experience reflect both intellectual curiosity and strong work ethic. Since arriving at Wharton (after spending most of his life on the west coast), Jared has distinguished himself as an engaged and respected member of our community. Within the Real Estate Club, he was selected to serve as Chief of Staff, a recognition of his industry knowledge and ability to bring people together. Separately, he has also been entrusted with helping plan the Future of Cities Conference, an initiative that reflects his passion for understanding how emerging technologies will reshape the built environment. Jared came to Wharton to explore careers beyond real estate, but, since arriving, it’s become clear that he is excited about contributing to the future of the industry. What I have appreciated most about Jared is his character. I’ve observed that he carries himself with humility, approaching others with genuine curiosity and respect. He is outgoing, compassionate, and always willing to engage with people from different backgrounds and perspectives. He is the type of person who makes a community stronger just by being part of it.", "I believe Jared embodies the qualities that make an exceptional member of The Rittenhouse Club: intellectual curiosity, integrity, ambition, and a sincere commitment to building meaningful relationships. I recommend him and am confident he will be a great addition to the Club. Jared Goldman’s candidacy is seconded by Mr. JD Smeallie (’27) and Mr. Tyler Patterson (’27).", "In the Bonds,", "Mr. Daniel Shlayen", "The Rittenhouse Club", "Class of 2027"], "mccaleb": ["Letter Expressing Support for Candidate Captain Luke McCaleb", "November 5, 2026", "Gentlemen of the Rittenhouse Club,", "It is with great enthusiasm that I recommend Captain Luke McCaleb for membership in The Rittenhouse Club. Having known Luke for over a decade, I can confidently say that he is one of the most genuine, respected, and selfless people I know. His character, leadership, and commitment to those around him make him an ideal candidate for our organization.", "Luke and I first met at Gonzaga College High School in Washington, D.C., where we became friends through freshman football and lacrosse. Even at a young age, Luke distinguished himself as a natural leader, eventually serving as captain of both the varsity football and lacrosse teams. He was also one of the most universally well-liked members of our class, a reputation he has maintained long after graduation. Nearly a decade later, Luke has taken it upon himself to keep our high school class connected, organizing reunions and maintaining a communication channel that continues to bring our classmates together.", "After Gonzaga, Luke attended Brown University, where he played on the men's lacrosse team and served as a three-time captain. Growing up with a father who served in the Army, Luke developed a deep respect for the military and knew from an early age that he wanted to become a Marine. Following graduation, he fulfilled that lifelong ambition and was commissioned as an officer in the United States Marine Corps, eventually earning the rank of Captain. During his service, he was stationed in Okinawa, Japan, where he served as a Platoon Commander and later as a Company Executive Officer.", "Since arriving at Wharton, Luke has quickly established himself as a leader among his classmates. He is an active member of the Veterans Club and a player on the Wharton Rugby Team, where he has built strong relationships and become a respected member of both communities. Despite recently getting married and balancing the demands of business school, Luke has made it a priority to remain involved in the broader Wharton community. He is a regular at Dive Bar Wednesdays and someone who consistently makes the effort to attend social events and build relationships outside his immediate circle. It is no surprise that he is quickly becoming one of the most well-liked and respected members of his class.", "What I respect most about Luke is that, despite everything he has accomplished, he remains the same humble and approachable person I met over ten years ago. He is the type of friend who will go out of his way for the people around him, and his commitment to maintaining friendships and bringing people together is something I have witnessed firsthand throughout our lives. I cannot think of many people better suited for the brotherhood and traditions of The Rittenhouse Club. Capt. McCaleb's candidacy is seconded by Staff Sergeant Rothe, Mr. Atwood, and Mr. Matt Friday (TRC ’25).", "In the Bonds,", "JD Smeallie"], "miller": ["A Letter Expressing Support for Candidate Scott Miller", "November 9, 2026", "Gentlemen of The Rittenhouse Club,", "It is my pleasure to write in support of Scott Miller’s membership in The Rittenhouse Club. I first got to know Scott during his application to Wharton and quickly developed a great deal of respect for him, both personally and professionally. Of the many prospective applicants who reached out to me, Scott was the one I felt confident enough to personally advocate for. I wrote a letter of support to the Wharton admissions office on his behalf, and even before his acceptance, I had begun bringing him around and introducing him to people in my own circles. I would not have done so had I not been confident in his character and the kind of person he is.", "Scott grew up in New Jersey before attending Harvard, where he played football. Following graduation, he joined the Navy, completed BUD/S, and earned his SEAL Trident. During his time in the SEAL Teams, he went on to qualify as both a Sniper and a Joint Terminal Attack Controller (JTAC), two particularly demanding qualifications. He graduated as the honorman of his Sniper class, deployed to Iraq, and later served as a Sniper Instructor, where he was responsible for training and mentoring future SEAL snipers.", "Scott is now pursuing his MBA at Wharton, where he is focused on a career in consulting. He is an active member of both the Wharton Rugby Club and the Wharton Veterans Club, making a consistent effort to attend events and contribute to both communities. He is also married and recently welcomed his first child, now two months old. Despite balancing school, recruiting, and a young family, he makes the time to remain involved. He doesn’t simply want to belong to something; he wants to contribute to it.", "Beyond his accomplishments, what stands out most to me is Scott’s character. He is humble, self-aware, and easy to get along with. He carries himself professionally, with poise, good judgment, and a sense of humor that makes him easy to be around. He is also consistently generous with his time and resources. When my car battery died one morning and left me stranded, Scott immediately offered to come over and jump-start it. It is a small example, but one that reflects his natural willingness to help others, often without being asked or expecting anything in return. I also believe Scott has a particularly good understanding of what membership in a club like TRC entails. Having both served in the SEAL Teams, we understand that being part of a selective organization is about much more than earning the opportunity to join. There is an expectation that you contribute to the community, uphold its standards, and remain engaged with the people around you. While the organizations are obviously very different, I think the underlying principle is much the same. Scott understands that membership comes with responsibilities, and his willingness to show up and contribute is something I have seen consistently. He has already made an effort to attend a breakfast at TRC, and I believe he would approach membership with that same level of engagement. My willingness to advocate for Scott, introduce him to people, and offer my own time and resources on his behalf long before he arrived at Wharton reflects the confidence I have in him. I offer my full and unreserved support for his membership and am confident he would be a great addition to The Rittenhouse Club.", "Sincerely,", "SO2 Alex Bilay", "The Rittenhouse Club", "Wharton MBA Class of 2027"], "cowan": ["A Letter Expressing Support for Candidate LT Casey Cowan", "November 10, 2026", "Gentlemen of The Rittenhouse Club,", "It is my privilege to recommend LT Casey Cowan for membership in The Rittenhouse Club. Casey is a man of quiet substance. He is reserved and observant, listens more than he talks, and notices what others need before they ask. I have known him only a short while, but it has taken just a few encounters to see that he is a man of character.", "One moment captures him better than anything on his résumé. A few weeks ago I was trying to sort out how to navigate my own VR&E paperwork and mentioned it in passing to someone else. Casey overheard. That evening, unprompted, he sent me a set of resources he had put together, then sat down with me and walked through how he had handled the same thing himself. He did not make a show of it, and he did not wait to be asked. That instinct, to act for others without being asked and without needing credit, is the clearest measure of character I know, and it is who Casey is. Casey grew up in Houston, where he was a two-time prep All-American and three-time All-State wrestler at The Kinkaid School. He went on to the United States Naval Academy, where he earned a degree in Systems Engineering, wrestled Division I for four years, and was named to the Commandant’s List three tim   else Object.keys(r.ballots).forEach(function(mid){var b=r.ballots[mid];Object.keys(b).forEach(function(cid){if(cid in t)t[cid]+=b[cid];});});
  return r.candIds.map(function(id){return {id:id,pts:t[id]};}).sort(function(a,b){return b.pts-a.pts;});
}
function plural(n,one,many){return n+' '+(n===1?one:many);}

/* ---------- header ---------- */
function renderHeader(){
  var s=seats(),acc=by('accepted').length;

  document.getElementById('status').innerHTML=
    '<span>Class of <b>'+state.classSize+'</b></span><span><b>'+acc+'</b> accepted</span><span><b>'+by('pending').length+'</b> in consideration</span><span>'+seatText+'</span><span><b>'+state.members.length+'</b> '+(state.members.length===1?'Member':'Members')+' voting</span>';
  document.getElementById('steps').innerHTML=STEPS.map(function(x){
    return '<li><button data-act="go" data-id="'+x[0]+'"'+(state.step===x[0]?' aria-current="step"':'')+'>'+x[1]+'</button></li>';
  }).join('');
}

/* ---------- setup ---------- */

  h+='<section class="tight"><h2>Voting on Members\' own phones</h2><p class="muted">Share this page\'s link with the Members. Each enters their name once. When a vote opens here, the ballot appears on their phone and their sealed ballot comes back to this console by itself. Only totals are shown, and individual ballots are erased when a vote closes.</p></section>';
  h+='<section class="tight"><h2>Move this setup to another device</h2><div class="row"><button class="btn" data-act="exportSetup">Copy this setup</button>'+(ui.setupCopied?'<span class="small">Copied.</span>':'')+'</div>'+
     (ui.setupText?'<textarea class="sealed" rows="3" readonly id="setupOut">'+esc(ui.setupText)+'</textarea>':'')+

/* ---------- letters ---------- */
function clockText(){var s=Math.max(0,timer.left);var m=Math.floor(s/60),r=s%60;return m+':'+(r<10?'0':'')+r;}
function renderLetters(){
  var list=state.candidates.filter(function(c){return c.status!=='void';});

  var h='<section class="tight"><span class="ref">Sec. 4, Subsection 1</span><h2>Reading of the letters</h2></section>';
  h+='<div class="cols"><div class="tight"><h3>Order of Candidates</h3><ul class="list">'+list.map(function(c){
     return '<li>'+av(c,'sm')+'<button class="btn quiet" data-act="pickLetter" data-id="'+c.id+'" style="flex:1;text-align:left;font-size:inherit;'+(c.id===cur.id?'font-weight:700':'')+'">'+esc(c.name)+'</button>'+
      (c.heard?'<span class="pill">Heard</span>':'')+'</li>';
  }).join('')+'</ul></div>';
  h+='<div class="stack"><div class="tight"><h3>Now hearing</h3>'+av(cur,'lg')+'<p style="font-family:var(--serif);font-size:var(--s4);line-height:1.2">'+esc(cur.name)+'</p></div>'+
    (cur.photo&&LETTERS[cur.photo]?'<div class="row"><button class="btn" data-act="letter" data-id="'+cur.photo+'">Read the letter</button></div>':'')+
    '<ol class="order"><li>'+(cur.proposer?esc(cur.proposer):'The Proposer')+' reads the letter aloud and may add a few remarks.</li>'+
    '<li>The Second has the first opportunity to speak if anything remains to be said.'+(cur.second?' Seconded by '+esc(cur.second)+'.':'')+'</li>'+
    '<li>The floor opens to the Members for discussion.</li></ol>'+
    '<div class="tight"><h3>Discussion time limit</h3><div class="clock" id="clock">'+clockText()+'</div>'+
    '<div class="row"><label>Minutes<input type="number" id="limitMin" min="1" max="60" value="'+state.limitMin+'" style="width:80px"></label>'+
    '<button class="btn" data-act="timerToggle" style="align-self:flex-end">'+(timer.running?'Pause':'Start')+'</button>'+
    '<button class="btn quiet" data-act="timerReset" style="align-self:flex-end">Reset</button></div>'+
    '<p class="muted small">The Officers may set a limit if needed. The clock is optional.</p></div>'+
    '<div class="row"><button class="btn primary" data-act="heard" data-id="'+cur.id+'">'+(cur.heard?'Heard. Go to the next Candidate':'Mark as heard and go to the next')+'</button></div></div></div>';
  var left=list.filter(function(c){return !c.heard;}).length;
  h+='<div class="row"><button class="btn'+(left?'':' primary')+'" data-act="go" data-id="r1">Go to round one</button><span class="muted small">'+(left?plural(left,'Candidate','Candidates')+' still to be heard.':'Every Candidate has been heard.')+'</span></div>';
  return h;
}

/* ---------- unanimity rounds ---------- */
function renderUnan(round){
  var isR1=round==='r1';
  var list=state.candidates.filter(function(c){return c.status==='pending'||(c.status==='accepted'&&c.via===round);});
  var fy=state.members.filter(function(m){return m.year===1;}).length;
  if(!isR1&&!fy){
    return '<section class="tight"><span class="ref">Sec. 4, Subsection 2</span><h2>Round two: Members in their first year</h2>'+
      '<p>No first-year Members are voting, so this round does not apply. The remaining Candidates go straight to the points rounds.</p></section>'+
      '<div class="row"><button class="btn primary" data-act="go" data-id="points">Go to the points rounds</button></div>';
  }
  var h='<section class="tight"><span class="ref">Sec. 4, Subsection 2</span><h2>'+(isR1?'Round one: the whole Membership':'Round two: Members in their first year')+'</h2>'+
    '<p>'+(isR1?'Call each Candidate in turn. If all '+plural(state.members.length,'Member','Members')+' support the Candidate, they are accepted at once.'
      :'Call each remaining Candidate. If all '+plural(fy,'first-year Member','first-year Members')+' support the Candidate, they are accepted.')+'</p></section>';
  var sp=state.sup[round];
  if(officerKey&&sp&&!sp.closed){
    var vs=votersOf(sp),inC=Object.keys(sp.ballots).length;
    h+='<section class="stack"><h3>Private vote open: '+inC+' of '+vs.length+' ballots in</h3>'+intakeHtml(sp)+
      '<div class="row">'+vs.map(function(m){return '<span class="pill'+(sp.ballots[m.id]?' in':'')+'">'+esc(m.name)+'</span>';}).join('')+'</div>'+
      '<p class="small">On this ballot: '+sp.candIds.map(function(id){var c=cand(id);return c?esc(c.name):'';}).join(', ')+'.</p>'+
      '<div class="row"><button class="btn primary" data-act="closeSup" data-id="'+round+'"'+(inC?'':' disabled')+'>Close and reveal the result</button>'+
      '<button class="btn quiet" data-act="openSup" data-id="'+round+'">Restart this vote with every Candidate in consideration</button>'+
      '<span class="muted small">Only unanimous or not unanimous is shown for each Candidate. Individual ballots are erased.'+(sp.pend.length?' '+plural(sp.pend.length,'sealed ballot is','sealed ballots are')+' unassigned and will not count.':'')+'</span></div></section>';
  }else if(officerKey&&list.length){
    h+='<div class="row"><button class="btn" data-act="openSup" data-id="'+round+'">'+(sp?'Run the private vote again':'Open a private vote on Members\' phones')+'</button>'+
      '<span class="muted small">'+(sp&&sp.closed?'Private vote closed with '+plural(sp.count,'ballot','ballots')+'. The results are marked below.':'Or call each Candidate and mark the result by hand below.')+'</span></div>';
  }
  if(!list.length){h+='<p class="muted">No Candidates remain in consideration for this round.</p>';}
  else{
    h+='<ul class="list">'+list.map(function(c){
      var v=state[round][c.id];
      return '<li>'+av(c)+'<span class="name">'+esc(c.name)+'</span>'+(c.status==='accepted'?'<span class="pill in">Accepted</span>':'')+
        '<span class="seg"><button data-act="unan" data-round="'+round+'" data-id="'+c.id+'" data-v="yes" aria-pressed="'+(v==='yes')+'">Unanimous</button>'+
        '<button data-act="unan" data-round="'+round+'" data-id="'+c.id+'" data-v="no" aria-pressed="'+(v==='no')+'">Not unanimous</button></span></li>';
    }).join('')+'</ul>';
  }
  if(seats()<0){h+='<div class="note"><p>More Candidates have been accepted than the class size allows. Raise the class size in Setup or change a result here.</p></div>';}
  var undecided=list.filter(function(c){return !state[round][c.id];}).length;
  h+='<div class="row"><button class="btn'+(undecided?'':' primary')+'" data-act="go" data-id="'+(isR1&&fy?'r2':'points')+'">'+(isR1&&fy?'Go to round two':'Go to the points rounds')+'</button>'+
     (undecided?'<span class="muted small">'+plural(undecided,'Candidate','Candidates')+' not yet called.</span>':'')+'</div>';
  return h;
}

/* ---------- points rounds ---------- */
function tallyHtml(r,selectable){
  var t=totals(r),max=Math.max(1,t.length?t[0].pts:1),s=selectable?seats():0,h='<ol class="tally">';
  t.forEach(function(x,i){
    var c=cand(x.id);if(!c)return;
    var next=t[i+1];
    var checked=ui.sel.indexOf(x.id)>=0;
    var box='';
    if(selectable){box='<input type="checkbox" id="sel-'+x.id+'" data-act="sel" data-id="'+x.id+'"'+(checked?' checked':'')+((!checked&&ui.sel.length>=s)?' disabled':'')+' aria-label="Accept '+esc(c.name)+'">';}
    else{box='<span class="num muted small">'+(i+1)+'</span>';}
    var tag=(!selectable&&r.accepted&&r.accepted.indexOf(x.id)>=0)?' <span class="pill in">Accepted</span>':'';
    h+='<li>'+box+'<label for="sel-'+x.id+'" style="font-size:inherit;color:inherit;display:flex;flex-direction:row;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere">'+av(c,'sm')+'<span>'+esc(c.name)+tag+'</span></label><span class="pts">'+x.pts+'</span>'+
       '<span class="bar"><i style="width:'+(x.pts/max*100).toFixed(1)+'%"></i></span>'+
       (next?'<span class="lead">'+(x.pts===next.pts?'Level with the next Candidate':'Leads the next Candidate by '+(x.pts-next.pts))+'</span>':'')+'</li>';
    if(selectable&&i===s-1&&next){
      h+='<li class="mark">'+plural(s,'seat','seats')+' open. '+(x.pts===next.pts?'There is a tie across this mark.':'Candidates above this mark would fill the class.')+'</li>';
    }
  });
  return h+'</ol>';
}
function pastRounds(){
  var done=state.rounds.filter(function(r){return r.decided;});
  if(!done.length)return '';
  return '<section class="tight"><h3>Earlier points rounds</h3>'+done.map(function(r){
    return '<details><summary>Round '+r.n+': '+(r.accepted.length?r.accepted.map(function(id){var c=cand(id);return c?esc(c.name):'';}).join(', ')+' accepted':'no one accepted')+'</summary><div style="padding:12px 0">'+tallyHtml(r,false)+'</div></details>';
  }).join('')+'</section>';
}
function renderBallot(r){
  var m=member(ui.ballotMember),b=budget(m),cp=cap(m),used=0;
  r.candIds.forEach(function(id){used+=ui.draft[id]||0;});
  var left=b-used;
  var h='<section class="tight"><span class="ref">Private ballot</span><h2>'+esc(m.name)+'</h2>'+
    '<p>'+(m.year===1?'First year':'Second year')+': '+b+' points to share among the Candidates, with at most '+cp+' on any one.</p></section>'+
    '<div class="tight"><span class="muted small">Points left</span><span class="budget">'+left+' of '+b+'</span></div>'+
    '<ul class="list ballot">'+r.candIds.map(function(id){
      var c=cand(id),v=ui.draft[id]||0;
      return '<li>'+av(c)+'<span class="name">'+esc(c.name)+'</span><span class="stepper">'+
        '<button data-act="dec" data-id="'+id+'" aria-label="One point fewer for '+esc(c.name)+'"'+(v<=0?' disabled':'')+'>&minus;</button>'+
        '<output>'+v+'</output>'+
        '<button data-act="inc" data-id="'+id+'" aria-label="One more point for '+esc(c.name)+'"'+((v>=cp||left<=0)?' disabled':'')+'>+</button></span></li>';
    }).join('')+'</ul>'+
    '<div class="row"><button class="btn primary" data-act="submitBallot">Submit ballot</button><button class="btn quiet" data-act="cancelBallot">Back without voting</button>'+
    (left>0?'<span class="muted small">'+plural(left,'point','points')+' unused. Unused points are not counted.</span>':'')+'</div>';
  return h;
}
function renderPoints(){
  var r=openRound(),h='<section class="tight"><span class="ref">Sec. 4, Subsection 3</span><h2>Points rounds</h2></section>';
  if(!r){
    var pend=by('pending'),s=seats();
    if(s<=0){h+='<div class="note row"><p class="grow">The class is full. No further voting is needed.</p><button class="btn primary" data-act="go" data-id="class">See the class</button></div>';}
    else if(!pend.length){h+='<p>No Candidates remain in consideration, with '+plural(s,'seat','seats')+' still open.</p>';}
    else if(!state.members.length){h+='<p>Add the Members in Setup before voting.</p>';}
    else{
      var n=state.rounds.length+1;
      h+='<p>'+plural(pend.length,'Candidate remains','Candidates remain')+' for '+plural(s,'open seat','open seats')+'. '+(state.members.some(function(m){return m.year===1;})?'Each Member receives a fresh allotment: 15 points in their first year, 10 in their second, and no more than half on any one Candidate.':'Each Member receives a fresh 10 points, with no more than 5 on any one Candidate.')+'</p>'+
         '<ul class="list">'+pend.map(function(c){return '<li>'+av(c)+'<span class="name">'+esc(c.name)+'</span></li>';}).join('')+'</ul>'+
         '<div class="row"><button class="btn primary" data-act="startRound">Open points round '+n+'</button></div>';
    }
    var lr=lastRound();
    if(lr&&lr.decided){h+='<div class="row"><button class="btn quiet" data-act="undoDecision">Reopen the decision on round '+lr.n+'</button></div>';}
    return h+pastRounds();
  }
  if(!r.closed){
    if(ui.recorded){
      return '<section class="stack"><h2>Ballot recorded</h2><p>Pass the device to the next Member.</p><div class="row"><button class="btn primary" data-act="nextMember">Next Member</button></div></section>';
    }
    if(ui.ballotMember&&member(ui.ballotMember))return renderBallot(r);
    var inCount=Object.keys(r.ballots).length;
    h+='<h3>Round '+r.n+': '+inCount+' of '+state.members.length+' ballots in</h3><p class="muted">Totals stay hidden until the Officers close the round.</p>'+intakeHtml(r)+
      '<p class="muted small">A Member without a phone can tap their name and vote on this device.</p><div class="members">'+state.members.map(function(m){
        var done=!!r.ballots[m.id];
        return '<button data-act="openBallot" data-id="'+m.id+'" class="'+(done?'done':'')+'">'+esc(m.name)+'<span>'+(done?'Ballot in':(m.year===1?'First year, 15 points':'Second year, 10 points'))+'</span></button>';
      }).join('')+'</div>';
    if(ui.confirm&&ui.confirm.indexOf('clear:')===0){
      var cm=member(ui.confirm.slice(6));
      if(cm){h+='<div class="note row"><p class="grow">'+esc(cm.name)+' has already voted. The Officers can discard that ballot so it can be cast again.</p><button class="btn" data-act="clearBallot" data-id="'+cm.id+'">Discard ballot</button><button class="btn quiet" data-act="cancel">Leave it</button></div>';}
    }
    var missing=state.members.length-inCount;
    if(ui.confirm==='close'){
      h+='<div class="note row"><p class="grow">'+plural(missing,'Member has','Members have')+' not voted.'+(r.pend.length?' '+plural(r.pend.length,'sealed ballot is','sealed ballots are')+' unassigned and will not count.':'')+' Close the round without them?</p><button class="btn primary" data-act="closeRound">Close and show the tally</button><button class="btn quiet" data-act="cancel">Keep voting open</button></div>';
    }else{
      h+='<div class="row"><button class="btn'+(missing?'':' primary')+'" data-act="'+(missing?'ask':'closeRound')+'" data-id="close"'+(inCount?'':' disabled')+'>Close voting and show the tally</button></div>';
    }
    return h+pastRounds();
  }
  var s2=seats();
  h+='<h3>Round '+r.n+' tally, '+plural(ballotCount(r),'ballot','ballots')+' counted</h3>'+
     '<p class="muted">Tick the clear leaders to accept them as Members. Whether a lead is clear is for the Officers to judge.</p>'+tallyHtml(r,true)+
     '<div class="row"><button class="btn primary" data-act="acceptSel">'+(ui.sel.length?'Accept '+plural(ui.sel.length,'Candidate','Candidates'):'Accept no one and vote again')+'</button>'+
     '<span class="muted small">'+plural(s2,'seat','seats')+' open.</span></div>';
  return h+pastRounds();
}

/* ---------- the class ---------- */
function recordText(){
  var L=['Membership vote record','Class size: '+state.classSize,''],acc=by('accepted'),pend=by('pending'),v=by('void');
  L.push('Accepted ('+acc.length+'):');acc.forEach(function(c){L.push('  '+c.name+' ('+viaLabel(c.via)+')');});
  if(pend.length){L.push('','Not selected or still in consideration ('+pend.length+'):');pend.forEach(function(c){L.push('  '+c.name);});}
  if(v.length){L.push('','Void under Sec. 5 ('+v.length+'):');v.forEach(function(c){L.push('  '+c.name);});}
  state.rounds.filter(function(r){return r.closed;}).forEach(function(r){
    L.push('','Points round '+r.n+' ('+ballotCount(r)+' ballots):');
    totals(r).forEach(function(x){var c=cand(x.id);if(c)L.push('  '+c.name+': '+x.pts);});
  });
  return L.join('\n');
}
function renderClass(){
  var acc=by('accepted'),pend=by('pending'),s=seats();
  var h='<section class="tight"><span class="ref">Result</span><h2>'+(s<=0?'The class is selected':'The class so far')+'</h2>'+
    '<p>'+acc.length+' of '+state.classSize+' places filled.'+(s>0&&pend.length?' Voting continues in the points rounds.':'')+'</p></section>';
  h+=acc.length?'<ul class="list">'+acc.map(function(c){return '<li>'+av(c)+'<span class="name">'+esc(c.name)+'</span><span class="muted small">'+viaLabel(c.via)+'</span></li>';}).join('')+'</ul>':'<p class="muted">No Candidates accepted yet.</p>';
  if(pend.length){h+='<section class="tight"><h3>'+(s<=0?'Not selected':'Still in consideration')+'</h3><ul class="list">'+pend.map(function(c){return '<li>'+av(c)+'<span class="name">'+esc(c.name)+'</span></li>';}).join('')+'</ul></section>';}
  h+='<div class="row"><button class="btn primary" data-act="copyRecord">Copy the record</button>'+(ui.copied?'<span class="small">Copied.</span>':'')+
     (s>0&&pend.length?'<button class="btn" data-act="go" data-id="points">Back to the points rounds</button>':'')+'</div>';
  if(ui.recordText){h+='<pre class="record" id="record">'+esc(ui.recordText)+'</pre>';}
  return h;
}

/* ---------- officers: blackball ---------- */
function renderOfficers(){
  var r=openRound();
  if(r&&!r.closed&&(ui.ballotMember||ui.recorded))return '';
  var live=by('pending'),v=by('void');
  if(!live.length&&!v.length)return '';
  var h='<details class="officers" id="officersBox"'+(ui.officersOpen?' open':'')+'><summary>Officers: Blackball under Sec. 5</summary><div class="stack">'+
    '<p class="muted small">Record a Blackball declared privately to the Officers before a vote. The Candidate becomes void and leaves consideration. No name or reason is stored here.</p><ul class="list">';
  live.forEach(function(c){
    h+='<li>'+av(c,'sm')+'<span class="name">'+esc(c.name)+'</span>';
    if(ui.confirm==='void:'+c.id){h+='<span class="small">Render this Candidate void?</span><button class="btn" data-act="doVoid" data-id="'+c.id+'">Confirm</button><button class="btn quiet" data-act="cancel">Cancel</button>';}
    else{h+='<button class="btn quiet" data-act="ask" data-id="void:'+c.id+'">Record a Blackball</button>';}
    h+='</li>';
  });
  v.forEach(function(c){h+='<li><span class="name">'+esc(c.name)+'</span><span class="pill out">Void</span><button class="btn quiet" data-act="restore" data-id="'+c.id+'">Restore</button></li>';});
  return h+'</ul></div></details>';
}

/* ---------- letters ---------- */
function bakedName(key){for(var i=0;i<BAKED.length;i++){if(BAKED[i][0]===key)return BAKED[i][1];}return '';}
function nameBtn(c){
  if(c&&c.photo&&LETTERS[c.photo])return '<button class="linkname name" data-act="letter" data-id="'+c.photo+'">'+esc(c.name)+'</button>';
  return '<span class="name">'+esc(c?c.name:'')+'</span>';
}
function candListHtml(idxs){
  return '<section class="tight"><h3>Candidates in consideration</h3><p class="muted small">Tap a name to read the letter.</p><ul class="list">'+idxs.map(function(i){
    var c={name:BAKED[i][1],photo:BAKED[i][0]};return '<li>'+av(c)+nameBtn(c)+'</li>';}).join('')+'</ul></section>';
}
function allIdx(){return BAKED.map(function(b,i){return i;});}
function renderLetter(){
  var key=ui.letter,ps=LETTERS[key]||[],c={name:bakedName(key),photo:key};
  return '<div class="row"><button class="btn" data-act="letterBack">Back</button></div>'+
    '<article class="letter">'+av(c,'lg')+'<h2>'+esc(ps[0]||c.name)+'</h2>'+ps.slice(1).map(function(t){return '<p>'+esc(t)+'</p>';}).join('')+'</article>'+
    '<div class="row"><button class="btn primary" data-act="letterBack">Back</button><a class="small" href="'+key+'.pdf" target="_blank" rel="noopener">Open the original letter (PDF)</a></div>';

/* ---------- Member ballot page ---------- */
function vBudget(){var y=vui.pc.years===2?vui.year:(vui.pc.years===1?1:2);return y===1?15:10;}
function saveVoter(){try{localStorage.setItem(VKEY,JSON.stringify({name:vui.name,year:vui.year,sentFor:vui.sentFor}));}catch(e){}}
function renderVoter(){

  if(!vui.nameSet){
    return '<section class="tight"><span class="ref">Private ballot</span><h2>Who is voting?</h2><p>Enter your full name. The ballot is sealed on this phone. Only the Officers\' tally can open it, and it shows totals, never an individual ballot.</p></section>'+
      '<div class="row"><label class="grow">Full name<input type="text" id="vName" autocomplete="name" value="'+esc(vui.name)+'"></label><button class="btn primary" data-act="vName" style="align-self:flex-end">Continue</button></div>'+errp;
  }
  var who='<div class="row"><span class="small muted">Voting as '+esc(vui.name)+'.</span><button class="btn quiet" data-act="vRename">Change name</button></div>';

    return '<section class="tight"><span class="ref">Private ballot</span><h2>Ballot sent</h2><p>The Officers have the sealed ballot. It can be changed until they close the vote. The next vote will appear here by itself.</p></section>'+who+
      '<div class="row"><button class="btn" data-act="vEdit">Change my ballot</button></div>'+candListHtml(vui.pc?vui.pc.idx:allIdx());

    return '<section class="tight"><span class="ref">Private ballot</span><h2>Ballot sealed, not yet sent</h2><p>The ballot could not be sent from this phone. Try again, or send this code to the Officers by message. It opens only with the Officers\' key.</p></section>'+
      '<textarea id="sealedOut" class="sealed" rows="5" readonly>'+esc(vui.sealed)+'</textarea>'+
      '<div class="row"><button class="btn primary" data-act="vSeal">Try sending again</button><button class="btn" data-act="vCopy">Copy the code</button>'+(vui.copied?'<span class="small">Copied.</span>':'')+
      '<button class="btn quiet" data-act="vEdit">Change my ballot</button></div>';
  }
  if(vui.pc){
    var pc=vui.pc,isPts=pc.type===2,back=vui.manual?'<button class="btn quiet" data-act="vReset">Back</button>':'';
    var h='<section class="tight"><span class="ref">Private ballot</span><h2>'+(isPts?'Points round '+pc.n:(pc.type===1?'Round two: first-year Members':'Round one: the whole Membership'))+'</h2></section>'+who;
    if(isPts){
      if(pc.years===2){
        h+='<div class="row"><span class="small muted">I am in my</span><span class="seg"><button data-act="vYear" data-id="1" aria-pressed="'+(vui.year===1)+'">First year, 15 points</button><button data-act="vYear" data-id="2" aria-pressed="'+(vui.year===2)+'">Second year, 10 points</button></span></div>';
      }
      var b=vBudget(),cp=Math.floor(b/2),used=0;pc.idx.forEach(function(i){used+=vui.draft[i]||0;});var left=b-used;
      h+='<p class="muted small">Tap a name to read the letter.</p><div class="tight"><span class="muted small">Points left, with at most '+cp+' on any one Candidate</span><span class="budget">'+left+' of '+b+'</span></div>'+
        '<ul class="list ballot">'+pc.idx.map(function(i){
          var c={name:BAKED[i][1],photo:BAKED[i][0]},v=vui.draft[i]||0;
          return '<li>'+av(c)+nameBtn(c)+'<span class="stepper">'+
            '<button data-act="vDec" data-id="'+i+'" aria-label="One point fewer for '+esc(c.name)+'"'+(v<=0?' disabled':'')+'>&minus;</button><output>'+v+'</output>'+
            '<button data-act="vInc" data-id="'+i+'" aria-label="One more point for '+esc(c.name)+'"'+((v>=cp||left<=0)?' disabled':'')+'>+</button></span></li>';
        }).join('')+'</ul>'+
        '<div class="row"><button class="btn primary" data-act="vSeal">Send my ballot</button>'+back+
        (left>0?'<span class="muted small">'+plural(left,'point','points')+' unused. Unused points are not counted.</span>':'')+'</div>';
    }else{
      var all=pc.idx.every(function(i){return vui.draft[i]===0||vui.draft[i]===1;});
      h+='<p class="muted">A Candidate is accepted in this round only if every ballot supports them. Tap a name to read the letter.</p><ul class="list">'+pc.idx.map(function(i){
          var c={name:BAKED[i][1],photo:BAKED[i][0]},v=vui.draft[i];
          return '<li>'+av(c)+nameBtn(c)+'<span class="seg"><button data-act="vSup" data-id="'+i+'" data-v="1" aria-pressed="'+(v===1)+'">Support</button>'+

    '<p class="muted small">'+(relay.ok?'Connected.':'Connecting. If nothing appears once a vote is open, check the signal or enter the round code by hand.')+'</p>'+
    (vui.manualOpen?'<div class="row"><label>Round code<input type="text" id="vCode" autocomplete="off" autocapitalize="characters" spellcheck="false" value="'+esc(vui.code)+'" style="width:150px"></label><button class="btn" data-act="vOpen" style="align-self:flex-end">Open the ballot</button></div>'
      :'<div class="row"><button class="btn quiet" data-act="vManual">Enter a round code by hand</button></div>')+errp+candListHtml(allIdx());
}
function renderUnlock(){
  return '<section class="tight"><span class="ref">Officers</span><h2>Unlock the console</h2><p>Paste the Officers\' key. It stays on this device and is what opens sealed ballots.</p></section>'+
    '<div class="row"><label class="grow">Officers\' key<input type="text" id="okey" autocomplete="off" spellcheck="false"></label><button class="btn primary" data-act="unlock" style="align-self:flex-end">Unlock</button>'+
    '<button class="btn quiet" data-act="toVoter" style="align-self:flex-end">Back</button></div>'+(ui.unlockErr?'<p class="small">'+esc(ui.unlockErr)+'</p>':'');

async function tryUnlock(d){
  d=String(d||'').trim();ui.unlockErr=null;
  try{var t=await openText(await sealText('ok'),d);if(t!=='ok')throw 0;officerKey=d;try{localStorage.setItem(OKEY,d);}catch(e){}ui.mode='console';}
  catch(e){ui.unlockErr='That key does not open ballots. Check that the whole key was pasted.';}
  render();
}
async function doSeal(){
  var pc=vui.pc,v=pc.idx.map(function(i){return vui.draft[i]||0;});
  var code;vui.err=null;
  try{code=await sealText(JSON.stringify({r:pc.code,n:vui.name,v:v,t:Date.now()}));}
  catch(e){vui.err='The ballot could not be sealed on this browser. Vote on the Officers\' device instead.';render();return;}
  try{await relayPost(code);vui.sent=true;vui.sealed=null;vui.sentFor=pc.code;saveVoter();}
  catch(e){vui.sealed=code;vui.copied=false;}
  render();
}
function render(){
  if(ui.letter){
    document.getElementById('status').hidden=true;document.getElementById('steps').hidden=true;
    document.getElementById('main').innerHTML=renderLetter();document.getElementById('officers').innerHTML='';return;
  }
  var con=ui.mode==='console';
  document.getElementById('status').hidden=!con;document.getElementById('steps').hidden=!con;
  if(!con){
    document.getElementById('main').innerHTML=ui.mode==='unlock'?renderUnlock():renderVoter();
    document.getElementById('officers').innerHTML=ui.mode==='unlock'?'':'<div class="row"><button class="btn quiet" data-act="toConsole">'+(officerKey?'Back to the Officers\' console':'Officers\' console')+'</button></div>';
    return;
  }
  renderHeader();
  var m=document.getElementById('main'),s=state.step;
  m.innerHTML=s==='setup'?renderSetup():s==='letters'?renderLetters():s==='r1'?renderUnan('r1'):s==='r2'?renderUnan('r2'):s==='points'?renderPoints():renderClass();
  var r0=openRound(),hide=r0&&!r0.closed&&(ui.ballotMember||ui.recorded);
  document.getElementById('officers').innerHTML=(hide||!CR?'':'<div class="row"><button class="btn quiet" data-act="toVoter">Cast my own ballot on the Member page</button></div>')+renderOfficers();
}
function commit(){if(officerKey||ui.mode==='console'){announce();save();}render();if(ui.restore){ui.restore=false;try{window.scrollTo(0,ui.scrollY||0);}catch(e){}}}

/* ---------- timer ---------- */
function stopTimer(){if(timer.handle){clearInterval(timer.handle);timer.handle=null;}timer.running=false;}
function resetTimer(){stopTimer();timer.left=state.limitMin*60;}
function tick(){
  timer.left-=1;var el=document.getElementById('clock');
  if(timer.left<=0){timer.left=0;stopTimer();if(state.step==='letters')render();return;}
  if(el)el.textContent=clockText();
}

/* ---------- actions ---------- */
var A={

  vRename:function(){vui.nameSet=false;vui.err=null;},

  vDec:function(id){var v=vui.draft[id]||0;if(v>0)vui.draft[id]=v-1;},
  vSup:function(id,el){vui.draft[id]=+el.getAttribute('data-v');},
  vSeal:function(){var pc=vui.pc;if(!pc)return;if(pc.type!==2&&!pc.idx.every(function(i){return vui.draft[i]===0||vui.draft[i]===1;}))return;doSeal();},
  vEdit:function(){vui.sealed=null;vui.sent=false;},
  vReset:function(){vui.pc=null;vui.manual=false;vui.manualOpen=false;vui.sealed=null;vui.sent=false;vui.draft={};vui.code='';vui.err=null;voterSync();},
  vCopy:function(){
    var t=vui.sealed,ta=document.getElementById('sealedOut');
    try{navigator.clipboard.writeText(t).then(function(){vui.copied=true;render();},function(){var x=document.getElementById('sealedOut');if(x){x.focus();x.select();}});}catch(e){if(ta){ta.focus();ta.select();}}
  },
  intake:function(){var p=activePoll(),ta=document.getElementById('intake');if(p&&ta)runIntake(p,ta.value);},
  exportSetup:function(){
    var t='TRCSETUP.'+b64u(new TextEncoder().encode(JSON.stringify({classSize:state.classSize,bakedSeen:state.bakedSeen,members:state.members,candidates:state.candidates.map(function(c){return {id:c.id,name:c.name,photo:c.photo||null,proposer:c.proposer,second:c.second};})})));
    ui.setupText=t;ui.setupCopied=false;
    try{navigator.clipboard.writeText(t).then(function(){ui.setupCopied=true;render();},function(){});}catch(e){}
  },
  importSetup:function(){
    var m=/TRCSETUP\.([A-Za-z0-9_-]+)/.exec(document.getElementById('setupIn').value||'');ui.setupErr=null;
    try{
      var o=JSON.parse(new TextDecoder().decode(unb64u(m[1])));if(!Array.isArray(o.members)||!Array.isArray(o.candidates))throw 0;
      var po=state.posted;state=blank();state.posted=po;state.classSize=Math.min(99,Math.max(1,+o.classSize||4));
      state.members=o.members.map(function(x){return {id:String(x.id||uid()),name:String(x.name||''),year:x.year===1?1:2};});
      state.candidates=o.candidates.map(function(x){return {id:String(x.id||uid()),name:String(x.name||''),photo:x.photo||undefined,proposer:String(x.proposer||''),second:String(x.second||''),status:'pending',via:null,heard:false};});
      state.bakedSeen=Array.isArray(o.bakedSeen)?o.bakedSeen:undefined;migrate();ui.setupText=null;
    }catch(e){ui.setupErr='That is not a setup copied from this app.';}
  },
  assign:function(id){
    var p=activePoll();if(!p)return;var x=p.pend.filter(function(q){return q.id===id;})[0],sel=document.getElementById('assign-'+id),m=sel&&member(sel.value);

  closeSup:function(round){

  },
  go:function(id){state.step=id;ui.intakeMsg=null;ui.confirm=null;ui.copied=false;ui.recordText=null;if(id!=='letters')stopTimer();},

  addMembers:function(){

  addCandidate:function(){

    state.rounds.forEach(function(r){r.candIds=r.candIds.filter(function(x){return x!==id;});r.accepted=(r.accepted||[]).filter(function(x){return x!==id;});Object.keys(r.ballots).forEach(function(m){delete r.ballots[m][id];});});
  },
  pickLetter:function(id){ui.lettersCand=id;resetTimer();},
  timerToggle:function(){

    ['r1','r2'].forEach(function(k){var p=state.sup[k];if(p&&!p.closed){p.candIds=p.candIds.filter(function(x){return x!==id;});Object.keys(p.ballots).forEach(function(m){delete p.ballots[m][id];});newCode(p);}});
  },
  restore:function(id){var c=cand(id);c.status='pending';var r=openRound();if(r&&!r.closed&&r.candIds.indexOf(id)<0){r.candIds.push(id);newCode(r);}},
  startRound:function(){
    var nr={type:'points',n:state.rounds.length+1,candIds:by('pending').map(function(c){return c.id;}),ballots:{},ts:{},pend:[],codes:[],closed:false,decided:false,accepted:[]};

  },

  dec:function(id){var v=ui.draft[id]||0;if(v>0)ui.draft[id]=v-1;},

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT')return;
  var act=el.getAttribute('data-act');if(!A[act])return;
  A[act](el.getAttribute('data-id'),el);commit();
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.getAttribute('data-act')==='sel'){A.sel(t.getAttribute('data-id'));commit();return;}
  if(t.id==='classSize'){var n=Math.round(+t.value);state.classSize=Math.min(99,Math.max(1,n||1));commit();}
  if(t.id==='limitMin'){var k=Math.round(+t.value);state.limitMin=Math.min(60,Math.max(1,k||1));resetTimer();commit();}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='vName'){e.preventDefault();A.vName();commit();return;}
  if(e.key==='Enter'&&e.target.id==='vCode'){e.preventDefault();A.vOpen();commit();return;}
  if(e.key==='Enter'&&e.target.id==='okey'){e.preventDefault();A.unlock();return;}
  if(e.key==='Enter'&&e.target.id==='newCand'){e.preventDefault();A.addCandidate();commit();var f=document.getElementById('newCand');if(f)f.focus();}
});
document.addEventListener('input',function(e){if(e.target.id==='vName')vui.name=e.target.value;if(e.target.id==='vCode')vui.code=e.target.value;});
document.addEventListener('toggle',function(e){if(e.target.id==='officersBox')ui.officersOpen=e.target.open;},true);

render();
relayStart();
if(officerKey){announce();save();}
})();
</script>

</body>
</html>
